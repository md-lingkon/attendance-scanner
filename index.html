<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR হাজিরা স্ক্যানার</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<!-- PDF তৈরির জন্য jsPDF এবং html2pdf লাইব্রেরি -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'SolaimanLipi', Arial, sans-serif;
    background: #0f172a;
    margin: 0;
    padding: 16px;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  h2 { text-align: center; color: #fff; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

  .card {
    background: #1e293b;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }

  label { display: block; margin-bottom: 6px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
  select, input {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 12px;
  }

  #reader { width: 100%; border-radius: 10px; overflow: hidden; }

  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .btn-start { background: #10b981; color: white; }
  .btn-start:hover { background: #059669; }
  .btn-stop { background: #ef4444; color: white; }
  .btn-stop:hover { background: #dc2626; }
  .btn-pdf { background: #3b82f6; color: white; margin-top: 10px; }
  .btn-pdf:hover { background: #2563eb; }
  .btn:disabled { background: #475569; cursor: not-allowed; }

  #status {
    margin-top: 14px; padding: 12px; border-radius: 8px; text-align: center;
    font-weight: bold; display: none; white-space: pre-wrap;
  }

  #log { max-height: 220px; overflow-y: auto; }
  .log-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 14px;
  }
  .log-ok { background: rgba(16,185,129,0.15); border-left: 4px solid #10b981; }
  .log-err { background: rgba(239,68,68,0.15); border-left: 4px solid #ef4444; }
  .log-warn { background: rgba(245,158,11,0.15); border-left: 4px solid #f59e0b; }
  .log-time { color: #94a3b8; font-size: 11px; }

  .badge { font-size: 12px; padding: 2px 8px; border-radius: 20px; background: #334155; color: #cbd5e1; }
  
  /* PDF প্রিন্ট টেমপ্লেট স্টাইল (হিডেন) */
  #pdfTemplate {
    display: none;
    background: #fff;
    color: #000;
    padding: 20px;
    font-family: Arial, sans-serif;
  }
  #pdfTemplate table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  #pdfTemplate th, #pdfTemplate td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
  }
  #pdfTemplate th { background-color: #f2f2f2; }
</style>
</head>
<body>
<div class="wrap">
  <h2>📷 QR হাজিরা স্ক্যানার</h2>
  <div class="subtitle">স্ট্যান্ডঅ্যালোন পেজ · Apps Script API দিয়ে সংযুক্ত</div>

  <div class="card">
    <label>সেশন সিলেক্ট করুন</label>
    <select id="sessionDrop"><option value="">লোড হচ্ছে...</option></select>

    <label>তারিখ</label>
    <input type="date" id="attDate">

    <div id="reader"></div>

    <div style="margin-top:14px; display:flex; gap:10px;">
      <button class="btn btn-start" id="startBtn" onclick="startScanner()">স্ক্যান শুরু করুন</button>
      <button class="btn btn-stop" id="stopBtn" onclick="stopScanner()" style="display:none;">থামান</button>
    </div>

    <div id="status"></div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <label style="margin:0;">সাম্প্রতিক স্ক্যান</label>
      <span class="badge" id="countBadge">0 জন</span>
    </div>
    <div id="log"><p style="color:#64748b; font-size:13px;">এখনও কোনো স্ক্যান হয়নি।</p></div>
    
    <button class="btn btn-pdf" id="pdfBtn" onclick="generatePDF()" disabled>📄 PDF রিপোর্ট ডাউনলোড করুন</button>
  </div>
</div>

<!-- PDF রিপোর্ট টেমপ্লেট -->
<div id="pdfTemplate">
  <h2 style="text-align:center; color:#000;">হাজিরা রিপোর্ট</h2>
  <hr>
  <p><strong>সেশন:</strong> <span id="pdfSession"></span></p>
  <p><strong>তারিখ:</strong> <span id="pdfDate"></span></p>
  <p><strong>মোট হাজিরা:</strong> <span id="pdfTotal"></span> জন</p>
  <table>
    <thead>
      <tr>
        <th>ক্রমিক</th>
        <th>রোল নম্বর</th>
        <th>সময়</th>
        <th>স্ট্যাটাস</th>
      </tr>
    </thead>
    <tbody id="pdfTableBody"></tbody>
  </table>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxxa5KzVMEIIulDcy4MUoMZigiCwcktoyk1JymCDtLPIc25lmDUIy3UMZJpJdQSor1-Ug/exec";

let html5QrCode = null;
let isProcessing = false;
let scannedCount = 0;

// সফলভাবে হাজিরা হওয়া রোলগুলোর রেকর্ড রাখা (ডুপ্লিকেট চেক করতে)
const completedRolls = new Set();
const scanHistoryData = []; // PDF রিপোর্টের জন্য ডেটা জমানো

async function callApi(payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('attDate').valueAsDate = new Date();
  try {
    const resp = await callApi({ action: "getSessions" });
    const drop = document.getElementById("sessionDrop");
    drop.innerHTML = '<option value="">-- সেশন বেছে নিন --</option>';
    if (resp.success && Array.isArray(resp.data)) {
      resp.data.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s; opt.text = s;
        drop.add(opt);
      });
    } else {
      drop.innerHTML = '<option value="">সেশন লোড ব্যর্থ হয়েছে</option>';
    }
  } catch (e) {
    document.getElementById("sessionDrop").innerHTML = '<option value="">সার্ভারে সংযোগ ব্যর্থ</option>';
    console.error(e);
  }
});

function startScanner() {
  const session = document.getElementById("sessionDrop").value;
  const date = document.getElementById("attDate").value;

  if (!session || !date) {
    showStatus("⚠️ প্রথমে সেশন ও তারিখ সিলেক্ট করুন!", "warn");
    return;
  }

  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 250, height: 250 } };

  html5QrCode.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    () => {}
  ).then(() => {
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "block";
    document.getElementById("sessionDrop").disabled = true;
    document.getElementById("attDate").disabled = true;
  }).catch(err => {
    showStatus("❌ ক্যামেরা চালু করা যায়নি: " + err, "err");
  });
}

function stopScanner() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      html5QrCode.clear();
      document.getElementById("startBtn").style.display = "block";
      document.getElementById("stopBtn").style.display = "none";
      document.getElementById("sessionDrop").disabled = false;
      document.getElementById("attDate").disabled = false;
    });
  }
}

async function onScanSuccess(decodedText) {
  if (isProcessing) return;

  let roll = decodedText.trim();
  try {
    const parsed = JSON.parse(decodedText);
    if (parsed && parsed.roll) roll = parsed.roll.toString();
  } catch (e) {}

  // 🔴 ডুপ্লিকেট স্ক্যান চেকার (এই সেশনে আগেই স্ক্যান হলে ব্লক করবে)
  if (completedRolls.has(roll)) {
    beepError();
    showStatus(`⚠️ রোল ${roll} ইতিমধ্যে স্ক্যান করা হয়েছে! (ডুপ্লিকেট)`, "warn");
    return;
  }

  isProcessing = true;
  if (html5QrCode) html5QrCode.pause(true);

  const session = document.getElementById("sessionDrop").value;
  const date = document.getElementById("attDate").value;

  showStatus("⏳ রোল " + roll + " প্রসেস হচ্ছে...", "info");
  beep();

  try {
    const resp = await callApi({ action: "markAttendance", roll: roll, session: session, date: date });
    if (resp.success) {
      const msg = resp.data;
      if (msg.includes("সফল") && !msg.includes("পাওয়া যায়নি") && !msg.includes("আগে হয়েছে")) {
        completedRolls.add(roll); // সফল রিকর্ড সেট-এ সেভ রাখা
        
        const scanTime = new Date().toLocaleTimeString('bn-BD');
        scanHistoryData.push({ roll: roll, time: scanTime, status: "সফল" });

        addLog(roll, "✅ হাজিরা সম্পন্ন — রোল " + roll, "ok");
        showStatus("✅ রোল " + roll + " — হাজিরা সফল হয়েছে", "ok");
        document.getElementById("pdfBtn").disabled = false; // PDF বাটন অ্যাক্টিভ
      } else if (msg.includes("আগে হয়েছে")) {
        completedRolls.add(roll); // আগেই সার্ভারে হয়ে থাকলে সেট করে রাখা
        addLog(roll, "⚠️ ইতিমধ্যে হাজিরা দেওয়া হয়েছে — রোল " + roll, "warn");
        showStatus("⚠️ রোল " + roll + " — আগেই হাজিরা দেওয়া হয়েছে", "warn");
      } else {
        addLog(roll, "❌ রোল খুঁজে পাওয়া যায়নি — রোল " + roll, "err");
        showStatus("❌ রোল " + roll + " — সেশনে পাওয়া যায়নি", "err");
      }
    } else {
      addLog(roll, "❌ এরর: " + resp.error, "err");
      showStatus("❌ এরর: " + resp.error, "err");
    }
  } catch (e) {
    addLog(roll, "❌ সার্ভারে সংযোগ ব্যর্থ", "err");
    showStatus("❌ সার্ভারে সংযোগ ব্যর্থ হয়েছে", "err");
  }

  setTimeout(() => {
    isProcessing = false;
    if (html5QrCode) html5QrCode.resume();
  }, 1200);
}

function showStatus(text, type) {
  const el = document.getElementById("status");
  el.style.display = "block";
  el.innerText = text;
  const colors = {
    ok: ["#d1fae5", "#065f46"],
    err: ["#fee2e2", "#991b1b"],
    warn: ["#fef3c7", "#92400e"],
    info: ["#e0f2fe", "#075985"]
  };
  const [bg, color] = colors[type] || colors.info;
  el.style.background = bg;
  el.style.color = color;
}

function addLog(roll, text, type) {
  scannedCount++;
  document.getElementById("countBadge").innerText = completedRolls.size + " জন (সফল)";
  const log = document.getElementById("log");
  if (scannedCount === 1) log.innerHTML = "";
  const item = document.createElement("div");
  item.className = "log-item log-" + type;
  const time = new Date().toLocaleTimeString('bn-BD');
  item.innerHTML = `<span>${text}</span><span class="log-time">${time}</span>`;
  log.prepend(item);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.12);
  } catch (e) {}
}

function beepError() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 300; // লো ফ্রিকোয়েন্সি সাউন্ড ওয়ার্নিংয়ের জন্য
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch (e) {}
}

// ---------- PDF তৈরি করার ফাংশন ----------
function generatePDF() {
  if (scanHistoryData.length === 0) {
    alert("ডাউনলোড করার মতো কোনো হাজিরা ডেটা নেই!");
    return;
  }

  const session = document.getElementById("sessionDrop").value;
  const date = document.getElementById("attDate").value;

  document.getElementById("pdfSession").innerText = session;
  document.getElementById("pdfDate").innerText = date;
  document.getElementById("pdfTotal").innerText = scanHistoryData.length;

  const tableBody = document.getElementById("pdfTableBody");
  tableBody.innerHTML = "";

  scanHistoryData.forEach((item, index) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${item.roll}</td>
      <td>${item.time}</td>
      <td>${item.status}</td>
    `;
    tableBody.appendChild(tr);
  });

  const element = document.getElementById("pdfTemplate");
  element.style.display = "block"; // প্রিন্ট তৈরি করার আগে দৃশ্যমান করা

  const opt = {
    margin:       10,
    filename:     `Attendance_${session}_${date}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(element).save().then(() => {
    element.style.display = "none"; // ডাউনলোড শেষে আবার হাইড করে দেওয়া
  });
}
</script>
</body>
</html>
