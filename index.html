<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR ও ম্যানুয়াল হাজিরা সিস্টেম</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'SolaimanLipi', Arial, sans-serif;
    background: #0f172a;
    margin: 0;
    padding: 16px;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  h2 { text-align: center; color: #fff; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

  .card {
    background: #1e293b;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }

  label { display: block; margin-bottom: 6px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
  select, input, textarea {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 12px;
    font-family: inherit;
  }

  textarea { resize: vertical; min-height: 70px; }

  #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #0f172a; }

  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .btn-start { background: #10b981; color: white; }
  .btn-start:hover { background: #059669; }
  .btn-stop { background: #ef4444; color: white; }
  .btn-stop:hover { background: #dc2626; }
  .btn-manual { background: #8b5cf6; color: white; }
  .btn-manual:hover { background: #7c3aed; }
  .btn-pdf { background: #3b82f6; color: white; margin-top: 10px; }
  .btn-pdf:hover { background: #2563eb; }
  .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }

  #status {
    margin-top: 14px; padding: 12px; border-radius: 8px; text-align: center;
    font-weight: bold; display: none; white-space: pre-wrap; word-break: break-word;
  }

  #log { max-height: 220px; overflow-y: auto; }
  .log-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 14px;
  }
  .log-ok { background: rgba(16,185,129,0.15); border-left: 4px solid #10b981; }
  .log-err { background: rgba(239,68,68,0.15); border-left: 4px solid #ef4444; }
  .log-warn { background: rgba(245,158,11,0.15); border-left: 4px solid #f59e0b; }
  .log-time { color: #94a3b8; font-size: 11px; margin-left: 8px; }

  .badge { font-size: 12px; padding: 2px 8px; border-radius: 20px; background: #334155; color: #cbd5e1; }
  
  .divider {
    text-align: center; margin: 16px 0; color: #64748b; font-size: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #334155; }
</style>
</head>
<body>
<div class="wrap">
  <h2>📷 হাজিরা ম্যানেজমেন্ট সিস্টেম</h2>
  <div class="subtitle">QR স্ক্যানার ও ফার্স্ট ম্যানুয়াল এন্ট্রি পেজ</div>

  <div class="card">
    <label>সেশন সিলেক্ট করুন</label>
    <select id="sessionDrop"><option value="">লোড হচ্ছে...</option></select>

    <label>তারিখ</label>
    <input type="date" id="attDate">

    <!-- ✍️ ম্যানুয়াল রোল এন্ট্রি সেকশন -->
    <label for="manualRolls">✍️ ম্যানুয়াল রোল নম্বর (কমা দিয়ে একাধিক লিখুন)</label>
    <textarea id="manualRolls" placeholder="উদাহরণ: 1, 2, 3, 4, 5"></textarea>
    <button class="btn btn-manual" id="manualBtn" onclick="submitManualAttendance()">ম্যানুয়াল হাজিরা সেভ করুন</button>

    <div class="divider">অথবা QR স্ক্যান করুন</div>

    <!-- 📷 QR স্ক্যানার সেকশন -->
    <div id="reader"></div>

    <div style="margin-top:14px; display:flex; gap:10px;">
      <button class="btn btn-start" id="startBtn" onclick="startScanner()">স্ক্যান শুরু করুন</button>
      <button class="btn btn-stop" id="stopBtn" onclick="stopScanner()" style="display:none;">থামান</button>
    </div>

    <div id="status"></div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <label style="margin:0;">সাম্প্রতিক হাজিরা</label>
      <span class="badge" id="countBadge">0 জন</span>
    </div>
    <div id="log"><p style="color:#64748b; font-size:13px;">এখনও কোনো ইনপুট দেওয়া হয়নি।</p></div>
    
    <button class="btn btn-pdf" id="pdfBtn" onclick="generatePDF()" disabled>📄 PDF রিপোর্ট সেভ করুন</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwm0UtKeERyPVNYUg2f2yMp9vDjVttTg4-kgTMYYwHYV9BV4qc0_ftjosHTXzUD3XcYvQ/exec";

let html5QrCode = null;
let scannedCount = 0;

const activeProcessingRolls = new Set();
const completedRolls = new Set();
const scanHistoryData = [];

async function callApi(payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

window.addEventListener('DOMContentLoaded', async () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('attDate').value = today;

  try {
    const resp = await callApi({ action: "getSessions" });
    const drop = document.getElementById("sessionDrop");
    drop.innerHTML = '<option value="">-- সেশন বেছে নিন --</option>';
    if (resp.success && Array.isArray(resp.data)) {
      resp.data.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s; opt.text = s;
        drop.add(opt);
      });
    } else {
      drop.innerHTML = '<option value="">সেশন লোড ব্যর্থ হয়েছে</option>';
    }
  } catch (e) {
    document.getElementById("sessionDrop").innerHTML = '<option value="">সার্ভারে সংযোগ ব্যর্থ</option>';
    console.error(e);
  }
});

/**
 * ⚡ ফার্স্ট ও সিকিউর বাল্ক প্রসেসিং (১ টিমাত্র API কলে সব ইনপুট প্রসেস হবে)
 */
async function submitManualAttendance() {
  const session = document.getElementById("sessionDrop").value;
  const date = document.getElementById("attDate").value;
  const rawInput = document.getElementById("manualRolls").value.trim();

  if (!session || !date) {
    showStatus("⚠️ প্রথমে সেশন ও তারিখ সিলেক্ট করুন!", "warn");
    return;
  }

  if (!rawInput) {
    showStatus("⚠️ অন্তত একটি রোল নম্বর ইনপুট দিন!", "warn");
    return;
  }

  // কমা, স্পেস বা নিউলাইন দিয়ে স্প্লিট
  const rawRolls = rawInput.split(/[\n, ]+/).map(r => r.trim()).filter(r => r.length > 0);
  
  // ক্লায়েন্ট সাইড ডুপ্লিকেট দূর করা
  const rollsToSend = [];
  const localDuplicates = [];

  rawRolls.forEach(r => {
    if (completedRolls.has(r) || rollsToSend.includes(r)) {
      localDuplicates.push(r);
    } else {
      rollsToSend.push(r);
    }
  });

  if (rollsToSend.length === 0) {
    showStatus("⚠️ ইনপুটকৃত সকল রোল ইতিমধ্যে যুক্ত করা হয়েছে!", "warn");
    return;
  }

  const btn = document.getElementById("manualBtn");
  btn.disabled = true;
  showStatus(`⏳ ${rollsToSend.length} টি রোল সার্ভারে সেভ হচ্ছে...`, "info");

  try {
    // 🚀 ১ টি মাত্র API কল পাঠানো হচ্ছে
    const resp = await callApi({
      action: "markAttendanceBulk",
      rolls: rollsToSend,
      session: session,
      date: date
    });

    if (resp.success && Array.isArray(resp.results)) {
      let successAdded = 0;
      let alreadyExist = 0;

      resp.results.forEach(item => {
        const roll = item.roll;
        const scanTime = new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });

        if (item.status === "success") {
          completedRolls.add(roll);
          scanHistoryData.push({ roll: roll, time: scanTime, status: "সফল (ম্যানুয়াল)" });
          addLog(roll, "✅ ম্যানুয়াল হাজিরা সম্পন্ন — রোল " + roll, "ok");
          successAdded++;
        } else {
          completedRolls.add(roll);
          addLog(roll, "⚠️ ইতিমধ্যে হাজিরা দেওয়া হয়েছে — রোল " + roll, "warn");
          alreadyExist++;
        }
      });

      document.getElementById("manualRolls").value = "";
      if (completedRolls.size > 0) document.getElementById("pdfBtn").disabled = false;

      showStatus(`✨ সম্পন্ন! সফল: ${successAdded} জন, ডুপ্লিকেট: ${alreadyExist + localDuplicates.length} জন।`, "ok");
    } else {
      showStatus("❌ সার্ভার এরর: " + (resp.error || "অজানা ত্রুটি"), "err");
    }
  } catch (e) {
    console.error(e);
    showStatus("❌ নেটওয়ার্ক বা সংযোগ ব্যর্থ হয়েছে!", "err");
  } finally {
    btn.disabled = false;
  }
}

function startScanner() {
  const session = document.getElementById("sessionDrop").value;
  const date = document.getElementById("attDate").value;

  if (!session || !date) {
    showStatus("⚠️ প্রথমে সেশন ও তারিখ সিলেক্ট করুন!", "warn");
    return;
  }

  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 15, qrbox: { width: 250, height: 250 } };

  html5QrCode.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    () => {}
  ).then(() => {
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "block";
    document.getElementById("sessionDrop").disabled = true;
    document.getElementById("attDate").disabled = true;
    showStatus("📷 স্ক্যানার রেডি! একের পর এক স্ক্যান করতে থাকুন...", "info");
  }).catch(err => {
    showStatus("❌ ক্যামেরা চালু করা যায়নি: " + err, "err");
  });
}

function stopScanner() {
  if (html5QrCode) {
    html5QrCode.stop().then(() => {
      html5QrCode.clear();
      document.getElementById("startBtn").style.display = "block";
      document.getElementById("stopBtn").style.display = "none";
      document.getElementById("sessionDrop").disabled = false;
      document.getElementById("attDate").disabled = false;
      showStatus("⏹️ স্ক্যানার বন্ধ করা হয়েছে", "info");
    }).catch(err => console.error(err));
  }
}

function extractRollNumber(decodedText) {
  if (!decodedText) return null;
  let text = decodedText.trim();

  try {
    const parsed = JSON.parse(text);
    if (parsed && parsed.roll) return parsed.roll.toString().trim();
  } catch (e) {}

  if (text.includes("|")) {
    const parts = text.split("|");
    for (let part of parts) {
      let trimmed = part.trim();
      if (/^\d+$/.test(trimmed)) return trimmed;
    }
  }

  const digitsMatch = text.match(/\b\d+\b/);
  if (digitsMatch) return digitsMatch[0];

  return text;
}

function onScanSuccess(decodedText) {
  const roll = extractRollNumber(decodedText);
  if (!roll) return;

  if (completedRolls.has(roll)) {
    beepError();
    showStatus(`⚠️ রোল ${roll} ইতিমধ্যে যুক্ত হয়েছে!`, "warn");
    return;
  }

  if (activeProcessingRolls.has(roll)) return;

  activeProcessingRolls.add(roll);
  beep();

  const session = document.getElementById("sessionDrop").value;
  const date = document.getElementById("attDate").value;

  showStatus("⏳ রোল " + roll + " প্রসেস হচ্ছে...", "info");
  
  // একক QR স্ক্যানের জন্য
  callApi({
    action: "markAttendanceBulk",
    rolls: [roll],
    session: session,
    date: date
  }).then(resp => {
    if (resp.success && resp.results && resp.results[0]) {
      const res = resp.results[0];
      if (res.status === "success") {
        completedRolls.add(roll);
        const scanTime = new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
        scanHistoryData.push({ roll: roll, time: scanTime, status: "সফল (QR)" });
        addLog(roll, "✅ হাজিরা সম্পন্ন — রোল " + roll, "ok");
        showStatus("✅ রোল " + roll + " — হাজিরা সফল হয়েছে", "ok");
        document.getElementById("pdfBtn").disabled = false;
      } else {
        completedRolls.add(roll);
        addLog(roll, "⚠️ ইতিমধ্যে হাজিরা দেওয়া হয়েছে — রোল " + roll, "warn");
        showStatus("⚠️ রোল " + roll + " — আগেই হাজিরা দেওয়া হয়েছে", "warn");
        beepError();
      }
    } else {
      showStatus("❌ প্রসেস করা যায়নি", "err");
      beepError();
    }
  }).catch(() => {
    showStatus("❌ সংযোগ ব্যর্থ হয়েছে", "err");
    beepError();
  }).finally(() => {
    activeProcessingRolls.delete(roll);
  });
}

function showStatus(text, type) {
  const el = document.getElementById("status");
  el.style.display = "block";
  el.innerText = text;
  const colors = {
    ok: ["#d1fae5", "#065f46"],
    err: ["#fee2e2", "#991b1b"],
    warn: ["#fef3c7", "#92400e"],
    info: ["#e0f2fe", "#075985"]
  };
  const [bg, color] = colors[type] || colors.info;
  el.style.background = bg;
  el.style.color = color;
}

function addLog(roll, text, type) {
  scannedCount++;
  document.getElementById("countBadge").innerText = completedRolls.size + " জন (সফল)";
  const log = document.getElementById("log");
  if (scannedCount === 1) log.innerHTML = "";
  const item = document.createElement("div");
  item.className = "log-item log-" + type;
  const time = new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
  item.innerHTML = `<span>${text}</span><span class="log-time">${time}</span>`;
  log.prepend(item);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  } catch (e) {}
}

function beepError() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 300;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.2);
  } catch (e) {}
}

function generatePDF() {
  if (scanHistoryData.length === 0) {
    alert("ডাউনলোড করার মতো কোনো হাজিরা ডেটা নেই!");
    return;
  }

  const session = document.getElementById("sessionDrop").value;
  const date = document.getElementById("attDate").value;

  const printWindow = window.open('', '_blank');
  if (!printWindow) {
    alert("❌ আপনার ব্রাউজারে Pop-up ব্লক করা আছে। অনুগ্রহ করে Pop-up টি Allow করে দিন।");
    return;
  }

  let tableRows = '';
  scanHistoryData.forEach((item, index) => {
    tableRows += `
      <tr>
        <td style="border:1px solid #333; padding:8px; text-align:center;">${index + 1}</td>
        <td style="border:1px solid #333; padding:8px; text-align:center; font-weight:bold;">${item.roll}</td>
        <td style="border:1px solid #333; padding:8px; text-align:center;">${item.time}</td>
        <td style="border:1px solid #333; padding:8px; text-align:center; color:#059669; font-weight:bold;">${item.status}</td>
      </tr>
    `;
  });

  const printContent = `
    <!DOCTYPE html>
    <html lang="bn">
    <head>
      <meta charset="UTF-8">
      <title>হাজিরা রিপোর্ট - ${session} (${date})</title>
      <style>
        body { font-family: Arial, sans-serif; padding: 20px; color: #000; }
        h2 { text-align: center; margin-bottom: 5px; }
        .meta { margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f2f2f2; border: 1px solid #333; padding: 8px; font-weight: bold; }
        @media print { body { padding: 0; } }
      </style>
    </head>
    <body>
      <h2>📋 হাজিরা রিপোর্ট</h2>
      <div class="meta">
        <p style="margin:4px 0;"><strong>সেশন:</strong> ${session}</p>
        <p style="margin:4px 0;"><strong>তারিখ:</strong> ${date}</p>
        <p style="margin:4px 0;"><strong>মোট উপস্থিতি:</strong> ${scanHistoryData.length} জন</p>
      </div>
      <table>
        <thead>
          <tr>
            <th>ক্রমিক</th>
            <th>রোল নম্বর</th>
            <th>সময়</th>
            <th>স্ট্যাটাস</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    </body>
    </html>
  `;

  printWindow.document.open();
  printWindow.document.write(printContent);
  printWindow.document.close();

  setTimeout(() => {
    printWindow.focus();
    printWindow.print();
  }, 500);
}
</script>
</body>
</html>
